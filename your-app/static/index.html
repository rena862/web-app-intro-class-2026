<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>My Dictionary App</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="dictionary-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 辞書登録エリア -->
      <form id="dictionary-form" class="input-area">
        <input
          type="text"
          id="word-input"
          class="word-input"
          placeholder="新しい単語を入力..."
          maxlength="100"
          autocomplete="off"
        />
        <button type="submit" class="word-button">追加</button>
      </form>

      <!-- 辞書リスト -->
      <ul id="dictionary-list" class="dictionary-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 Dictionary App</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>

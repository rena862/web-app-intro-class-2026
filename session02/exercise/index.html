 <h1>キャベツ太郎の自己紹介</h1>

    <ul>

<ul>

</ul>
    <!-- TODO: h2タグで「好きなサイト」という見出しを作ろう -->
<h2>好きなサイト</h2>

<a href="https://www.yaokin.com/products_search/snack/item_M02116">キャベツ太郎</a>
    <!-- ============================================
         実習4: セマンティックタグで構造化しよう
         上で書いた内容を、以下のセマンティックタグで囲み直してください

         ヒント: 以下の構造にしてみよう
         <header>
             <h1>名前</h1>
         </header>
         <main>
             <section>
                 <h2>自己紹介</h2>
                 <p>...</p>
             </section>
             <section>
                 <h2>趣味</h2>
                 <ul>...</ul>
             </section>
             <section>
                 <h2>好きなサイト</h2>
                 <a>...</a>
             </section>
         </main>
         <footer>
             <p>&copy; 2026 あなたの名前</p>
         </footer>
    ============================================ -->
<header>
        <h1>はじめましてのWebページ</h1>
        <p>キャベツのサイト始めました</p>
</header>
    <main>
    <section>
        <h2>キャベツ太郎の自己紹介（非公式）</h2>
        <p>キャベツ学校の2年生です</p>
    </section>

    <section>
        <h2>趣味</h2>
        <ul>
            <li>野菜作り</li>
            <li>お菓子作り</li>
        </ul>
        <h2>好きなサイト</h2>
        <a><a href="https://www.yaokin.com/products_search/snack/item_M02116">キャベツ太郎</a></a>
    </section>

    </main>
    <footer>
        <p>&copy; 2026 キャベツ太郎</p>
    </footer>
